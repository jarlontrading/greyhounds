name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation-db:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: isolated-cancellation-ci
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pisolated-cancellation-ci" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Test durable cancellation alert observer
        run: python3 -m unittest discover -s greyhoundtrader/Monitoring -p test_cancellation_alerts.py -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cancellation policy and isolated SQL recovery checks
        env:
          RG_CANCELLATION_TEST_MYSQL: 'Server=127.0.0.1;Port=3306;User ID=root;Password=isolated-cancellation-ci;Database=mysql;SslMode=Disabled'
        run: dotnet run --project CancellationTests/CancellationTests.csproj -c Release
  verify:
    needs: cancellation-db
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { 'v0.0.0-ci.${{ github.run_number }}' }
          ./scripts/Build-Release.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: traders-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: greyhounds-application-${{ github.sha }}
          path: |
            artifacts/*/greyhounds/GreyhoundTrader.Web.dll
            artifacts/*/greyhounds/GreyhoundTrader.Web.pdb
            artifacts/*/manifest.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" packages/*.zip --draft --generate-notes --verify-tag
